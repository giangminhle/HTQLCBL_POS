name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  lint-test-build:
    name: Lint, test, build (api, admin, pos, shared)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail_ci_password
          POSTGRES_DB: retailchain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U retail -d retailchain_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # E2E tests reset this database before running (name must end with _test).
      DATABASE_URL: postgresql://retail:retail_ci_password@localhost:5432/retailchain_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint + typecheck
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Apply migrations to a real PostgreSQL
        run: pnpm --filter @retailchain/api exec prisma migrate deploy
      - name: Test (unit + E2E on PostgreSQL)
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v4
      - name: Build compose images
        run: docker compose build
